name: template
description: Twilight reference app — copy this to start a new product.
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  cupertino_icons: ^1.0.8

  # Shared platform packages
  core:
    path: ../../packages/core
  auth:
    path: ../../packages/auth
  network:
    path: ../../packages/network
  ui:
    path: ../../packages/ui
  analytics:
    path: ../../packages/analytics
  storage:
    path: ../../packages/storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
