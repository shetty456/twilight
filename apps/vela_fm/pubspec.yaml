name: vela_fm
description: Hindi audio stories with an English browsing experience.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  dio: ^5.7.0
  audioplayers: ^6.4.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  core:
    path: ../../packages/core
  auth:
    path: ../../packages/auth
  network:
    path: ../../packages/network
  storage:
    path: ../../packages/storage
  ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
