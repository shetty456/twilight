name: nine_lamps
description: A nine-night devotional runner.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.23.0
  flame_audio: ^2.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
  assets:
    - assets/images/world_concept.png
    - assets/images/night_one_path.png
    - assets/images/rajas_path.png
    - assets/images/sattva_path.png
    - assets/images/devotee_run_1.png
    - assets/images/devotee_run_2.png
    - assets/images/devotee_jump.png
    - assets/images/devotee_slide.png
    - assets/images/diya_collectible.png
    - assets/images/stone_obstacle.png
    - assets/audio/
